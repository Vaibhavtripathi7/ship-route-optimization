[project]
name = "ship-routing"
version = "0.2.0"
description = "Weather routing for merchant ships with PPO, evaluated against A* and fixed speed baselines"
authors = [{name = "Vaibhav Tripathi", email = "vaibhavtripathi2020@gmail.com"}]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26,<2",
    "scipy>=1.12,<2",
    "torch>=2.2,<3",
    "gymnasium>=0.29,<0.30",
    "stable-baselines3>=2.7.1,<3",
    "matplotlib>=3.8,<4",
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.32,<0.33",
]

[tool.poetry]
packages = [{include = "ship_routing", from = "src"}]

[tool.poetry.dependencies]
torch = {source = "pytorch-cpu"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.8"
httpx = "^0.28"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
