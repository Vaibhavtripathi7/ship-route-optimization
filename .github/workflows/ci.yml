name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install poetry
      - run: poetry install
      - run: poetry run ruff check .
      - run: poetry run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ship-routing .
      - name: Start the service and route one voyage
        run: |
          docker run -d -p 8000:8000 ship-routing
          for _ in $(seq 60); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/route -H "Content-Type: application/json" \
            -d '{"start": [10, 60], "goal": [15, 70], "planner": "ppo"}'
